<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM Autoscaling Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
        .info-box {
            background-color: #e9f7fe;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 20px;
        }
        .stress-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        .button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .button:hover {
            background-color: #45a049;
        }
        .button.red {
            background-color: #f44336;
        }
        .button.red:hover {
            background-color: #d32f2f;
        }
        .button.blue {
            background-color: #2196F3;
        }
        .button.blue:hover {
            background-color: #0b7dda;
        }
        input[type="number"] {
            padding: 8px;
            width: 60px;
        }
        .metrics {
            margin-top: 20px;
            background-color: #f1f1f1;
            padding: 15px;
            border-radius: 4px;
        }
        .metric-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .metric-value {
            font-weight: bold;
        }
        .progress-bar {
            height: 20px;
            background-color: #e0e0e0;
            border-radius: 4px;
            margin-top: 5px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #4CAF50;
            width: 0%;
            transition: width 0.5s ease-in-out;
        }
        .response {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f8f8;
            border-left: 4px solid #ddd;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>VM Autoscaling Demo</h1>
        
        <div class="info-box">
            <p><strong>Deployment:</strong> <span id="deployment">{{ deployment }}</span></p>
            <p><strong>Hostname:</strong> <span id="hostname">{{ hostname }}</span></p>
        </div>
        
        <h2>Resource Stress Controls</h2>
        <div class="stress-controls">
            <div>
                <label for="cpu-threads">CPU Threads:</label>
                <input type="number" id="cpu-threads" min="1" max="16" value="2">
                <button class="button" onclick="stressCPU()">Stress CPU</button>
            </div>
            
            <div>
                <label for="memory-size">Memory (MB):</label>
                <input type="number" id="memory-size" min="50" max="2000" value="100">
                <button class="button blue" onclick="stressMemory()">Stress Memory</button>
            </div>
            
            <div>
                <button class="button red" onclick="clearStress()">Clear All Stress</button>
            </div>
        </div>
        
        <h2>Resource Metrics</h2>
        <div class="metrics">
            <div class="metric-item">
                <span>CPU Usage:</span>
                <span class="metric-value" id="cpu-percent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="cpu-bar"></div>
            </div>
            
            <div class="metric-item">
                <span>Memory Usage:</span>
                <span class="metric-value" id="mem-percent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="mem-bar"></div>
            </div>
        </div>
        
        <div class="response" id="response-box"></div>
    </div>
    
    <script>
        // Function to update metrics
        function updateMetrics() {
            fetch('/metrics')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('cpu-percent').textContent = `${data.cpu_percent.toFixed(1)}%`;
                    document.getElementById('mem-percent').textContent = `${data.mem_percent.toFixed(1)}%`;
                    document.getElementById('cpu-bar').style.width = `${data.cpu_percent}%`;
                    document.getElementById('mem-bar').style.width = `${data.mem_percent}%`;
                    
                    // Update color based on usage
                    updateProgressBarColor('cpu-bar', data.cpu_percent);
                    updateProgressBarColor('mem-bar', data.mem_percent);
                })
                .catch(error => console.error('Error fetching metrics:', error));
        }
        
        function updateProgressBarColor(id, percent) {
            const bar = document.getElementById(id);
            if (percent < 60) {
                bar.style.backgroundColor = '#4CAF50'; // Green
            } else if (percent < 80) {
                bar.style.backgroundColor = '#FFC107'; // Yellow
            } else {
                bar.style.backgroundColor = '#F44336'; // Red
            }
        }
        
        // Stress functions
        function stressCPU() {
            const threads = document.getElementById('cpu-threads').value;
            fetch(`/stress/cpu?threads=${threads}`)
                .then(response => response.json())
                .then(data => showResponse(data))
                .catch(error => console.error('Error stressing CPU:', error));
        }
        
        function stressMemory() {
            const size = document.getElementById('memory-size').value;
            fetch(`/stress/memory?size=${size}`)
                .then(response => response.json())
                .then(data => showResponse(data))
                .catch(error => console.error('Error stressing memory:', error));
        }
        
        function clearStress() {
            fetch('/stress/clear')
                .then(response => response.json())
                .then(data => showResponse(data))
                .catch(error => console.error('Error clearing stress:', error));
        }
        
        function showResponse(data) {
            const responseBox = document.getElementById('response-box');
            responseBox.textContent = JSON.stringify(data, null, 2);
            responseBox.style.display = 'block';
            
            // Hide after 5 seconds
            setTimeout(() => {
                responseBox.style.display = 'none';
            }, 5000);
        }
        
        // Update metrics initially and every 2 seconds
        updateMetrics();
        setInterval(updateMetrics, 2000);
    </script>
</body>
</html>
